name: pennant-store-benchmark
on: [push, pull_request]
permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  paired-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Verify frozen baseline, unchanged dependencies and reversible test-only timers
        run: |
          python3 tools/generate_store_benchmark.py --check --evidence app/build/pennant-store-benchmark/generation.json
          mkdir -p app/build/pennant-store-benchmark/generated-sources
          cp app/src/androidTest/java/com/example/baseballsim/data/generated/*.kt app/build/pennant-store-benchmark/generated-sources/
          cp app/src/main/java/com/example/baseballsim/data/RoomSeasonStore.kt app/build/pennant-store-benchmark/distribution-RoomSeasonStore.kt
          git rev-parse HEAD > app/build/pennant-store-benchmark/SOURCE_HEAD.txt
      - name: Verify official Wrapper bytes
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Fixed SDK packages in CI only
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Allow KVM inside this disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          working-directory: android
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: |
            bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
            bash tools/pennant_store_benchmark.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pennant-store-benchmark-${{ env.SOURCE_SHA }}
          path: android/app/build/pennant-store-benchmark/
          if-no-files-found: error
          retention-days: 14
