name: phase4e-reference-tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s prototypes/phase4e/tests -v
      - run: python -m unittest discover -s prototypes/phase4d/tests -v
      - run: python -m unittest discover -s prototypes/phase4c/tests -v
      - run: python -m unittest discover -s prototypes/phase4a/tests -v
      - run: python -m unittest discover -s prototypes/phase4b/tests -v
