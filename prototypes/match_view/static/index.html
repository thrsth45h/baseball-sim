<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="match-token" content="__MATCH_TOKEN__">
  <title>1試合の操作画面 · Baseball Sim</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="page-header">
      <div><p class="brand">BASEBALL SIM</p><h1>1試合の試作</h1></div>
      <form id="new-game" class="seed-form">
        <label for="seed">seed</label>
        <input id="seed" name="seed" type="text" inputmode="numeric" pattern="[0-9]+" value="42" maxlength="20" required autocomplete="off" spellcheck="false">
        <button type="submit" class="new-button">新しい試合</button>
      </form>
    </header>

    <p id="error" class="error" role="alert" hidden></p>
    <section class="match" aria-label="試合スコア">
      <div class="match-top"><span id="phase" class="phase">読み込み中</span><span id="pitch-total">0球</span></div>
      <div class="scoreboard">
        <div class="team away"><span class="team-mark" aria-hidden="true">A</span><h2>仮Away</h2></div>
        <div class="score" aria-label="得点"><span id="away-score">0</span><span class="score-divider" aria-hidden="true">:</span><span id="home-score">0</span></div>
        <div class="team home"><span class="team-mark" aria-hidden="true">H</span><h2>仮Home</h2></div>
      </div>
      <p id="outcome" class="outcome" hidden></p>
      <p id="ending-reason" class="ending-reason" hidden></p>
      <table class="line-score">
        <caption class="sr-only">イニング別得点。横線は未実行。</caption>
        <thead><tr><th scope="col">チーム</th><th scope="col">1</th><th scope="col">2</th><th scope="col">3</th><th scope="col">4</th><th scope="col">5</th><th scope="col">6</th><th scope="col">7</th><th scope="col">8</th><th scope="col">9</th><th scope="col">計</th></tr></thead>
        <tbody><tr id="away-line"><th scope="row">仮Away</th></tr><tr id="home-line"><th scope="row">仮Home</th></tr></tbody>
      </table>
      <p id="walkoff-note" class="walkoff-note" hidden>9回裏はサヨナラで途中終了</p>
    </section>

    <section id="current" class="current" aria-label="現在の打席">
      <div class="batter"><span id="batter-slot" class="slot">1番</span><h2 id="batter-name">Away 1</h2><span id="batting-side">仮Awayの攻撃</span></div>
      <div class="count" aria-label="カウント">
        <div><span class="count-label">B</span><span id="balls" class="dots balls" aria-label="ボール0"></span><span id="balls-number" class="count-number">0</span></div>
        <div><span class="count-label">S</span><span id="strikes" class="dots strikes" aria-label="ストライク0"></span><span id="strikes-number" class="count-number">0</span></div>
        <div><span class="count-label">O</span><span id="outs" class="dots outs" aria-label="アウト0"></span><span id="outs-number" class="count-number">0</span></div>
      </div>
      <div id="bases" class="diamond" role="img" aria-label="走者なし"><span class="base second" data-base="2">2</span><span class="base third" data-base="3">3</span><span class="base first" data-base="1">1</span><span class="plate" aria-hidden="true"></span></div>
    </section>

    <fieldset id="progress" class="actions" disabled>
      <legend class="sr-only">試合を進める</legend>
      <button type="button" data-command="pitch">1球</button>
      <button type="button" data-command="plate_appearance" class="primary">1打席</button>
      <button type="button" data-command="finish">最後まで</button>
    </fieldset>

    <section class="timeline" aria-labelledby="log-title">
      <div class="section-heading"><h2 id="log-title">直近のプレー</h2><span id="pa-total">完了打席 0</span></div>
      <ol id="recent"><li class="empty">「1球」または「1打席」で試合を始めます。</li></ol>
    </section>
    <footer>全員共通の仮確率を使う合成試作。能力・公式個人成績・Android製品UIは未実装。</footer>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
